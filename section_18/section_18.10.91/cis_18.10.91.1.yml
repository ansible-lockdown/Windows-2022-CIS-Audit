---

{{ if .Vars.win22cis_level_2 }}
  {{ if .Vars.win22cis_rule_18_10_91_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Service\Winrs\AllowRemoteShellAccess:
    title: "18.10.91.1 | Ensure 'Allow Remote Shell Access' is set to 'Disabled' | AllowRemoteShellAccess"
    exists: true
    value: 0
    type: REG_DWORD
    skip: {{ if not .Vars.win22cis_win_skip_for_test }}false{{ else }}true{{ end }}
    meta:
      skip_reason: "win_skip_for_test is set - the role leaves this control alone so the managing connection survives; set win_skip_for_test: false to apply it"
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.10.91.1
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
