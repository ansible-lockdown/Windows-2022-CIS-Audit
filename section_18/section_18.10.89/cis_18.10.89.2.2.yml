---

{{ if .Vars.win22cis_level_2 }}
  {{ if .Vars.win22cis_rule_18_10_89_2_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Winrm\Service\AllowAutoConfig:
    title: "18.10.89.2.2 | Ensure 'Allow remote server management through WinRM' is set to 'Disabled' | AllowAutoConfig"
    exists: true
    value: 0
    type: REG_DWORD
    skip: {{ if not .Vars.win22cis_win_skip_for_test }}false{{ else }}true{{ end }}
    meta:
      skip_reason: "win_skip_for_test is set - the role leaves this control alone so the managing connection survives; set win_skip_for_test: false to apply it"
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.10.89.2.2
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
