---

{{ if .Vars.win22cis_level_1 }}
  {{ if .Vars.win22cis_rule_18_11_2 }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\DisableProxyAuthenticationSchemes:
    title: "18.11.2 | Ensure 'Disable HTTP proxy features: Disable proxy authentication' is set to 'Enabled: Disable authentication over loopback interfaces' or higher | DisableProxyAuthenticationSchemes"
    exists: true
    value: 256
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.11.2
      NIST800-53R5:
        - CM-7b
  {{ end }}
{{ end }}
