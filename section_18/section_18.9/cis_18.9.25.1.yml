---

{{ if and (ne .Vars.win22cis_system_role "domaincontroller") .Vars.win22cis_level_1 }}
  {{ if .Vars.win22cis_rule_18_9_25_1 }}
    {{ if eq .Vars.win22cis_system_role "memberserver" }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\BackupDirectory:
    title: "18.9.25.1 | Ensure 'Configure password backup directory' is set to 'Enabled: Active Directory' or 'Enabled: Azure Active Directory' | BackupDirectory"
    exists: true
    value: {{ .Vars.win22cis_laps_backupdirectory_value }}
    type: REG_DWORD
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.25.1
      NIST800-53R5:
        - CP-9
    {{ end }}
  {{ end }}
{{ end }}
