---

{{ if and (ne .Vars.win22cis_system_role "domaincontroller") .Vars.win22cis_level_1 }}
  {{ if .Vars.win22cis_rule_18_9_26_6 }}
    {{ if eq .Vars.win22cis_system_role "memberserver" }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PasswordAgeDays:
    title: "18.9.26.6 | Ensure 'Password Settings: Password Age (Days)' is set to 'Enabled: 30 or fewer' (MS only) | PasswordAgeDays"
    exists: true
    value: {{ .Vars.win22cis_laps_passwordagedays_value }}
    type: REG_DWORD
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.26.6
      NIST800-53R5:
        - IA-5(1)
    {{ end }}
  {{ end }}
{{ end }}
