---

{{ if .Vars.win22cis_ngws }}
  {{ if .Vars.win22cis_rule_18_9_27_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\System\RunAsPPL:
    title: "18.9.27.2 | Ensure 'Configures LSASS to run as a protected process' is set to 'Enabled: Enabled with UEFI Lock' | RunAsPPL"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.27.2
      NIST800-53R5:
        - SI-16
  {{ end }}
{{ end }}
