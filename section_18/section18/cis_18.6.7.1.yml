    title: "18.6.7.1 | Ensure 'Mandate the minimum version of SMB' is set to 'Enabled: 3.1.1' | MinSmb2Dialect"
    exists: true
    value: 785
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.6.7.1
      NIST800-53R5:
        - SC-7(10)
        - SC-12
        - SC-13
        - SC-28
        - CM-6
        - CM-7
        - SI-7(1)
  {{ end }}
{{ end }}
