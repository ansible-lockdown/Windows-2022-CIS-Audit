---

{{ if and (ne .Vars.win22cis_system_role "domaincontroller") .Vars.win22cis_level_2 }}
  {{ if .Vars.win22cis_rule_18_9_36_2 }}
    {{ if eq .Vars.win22cis_system_role "memberserver" }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Rpc\RestrictRemoteClients:
    title: "18.9.36.2 | Ensure 'Restrict Unauthenticated RPC clients' is set to 'Enabled: Authenticated' (MS only) | RestrictRemoteClients"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.9.36.2
      NIST800-53R5:
        - SI-4
    {{ end }}
  {{ end }}
{{ end }}
