  HKLM\SYSTEM\CurrentControlSet\Control\SAM\RelaxMinimumPasswordLengthLimits:
    title: "1.1.6 | Ensure 'Relax minimum password length limits' is set to 'Enabled' | RelaxMinimumPasswordLengthLimits"
