---

{{ if and (eq .Vars.win22cis_system_role "domaincontroller") .Vars.win22cis_level_1 }}
  {{ if .Vars.win22cis_rule_17_4_1 }}
    {{ if eq .Vars.win22cis_system_role "domaincontroller" }}
file:
  win22cis_17_4_1_directory_service_access:
    title: "17.4.1 | Ensure 'Audit Directory Service Access' is set to include 'Failure' (DC only) | Directory Service Access"
    path: '{{ .Vars.win22cis_snapshot_dir }}\AuditPolicy.17.4.1'
    exists: true
    contents:
      - '/^[23]$/'
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 17.4.1
      NIST800-53R5:
        - AU-3
        - AU-3(1)
        - AU-7
        - AU-12
    {{ end }}
  {{ end }}
{{ end }}
