    {{ if eq .Vars.win22cis_system_role "domaincontroller" }}
file:
  win22cis_17_1_2_kerberos_authentication_service:
    title: "17.1.2 | Ensure 'Audit Kerberos Authentication Service' is set to 'Success and Failure' (DC Only) | Kerberos Authentication Service"
    path: '{{ .Vars.win22cis_snapshot_dir }}\AuditPolicy.17.1.2'
    exists: true
    contents:
      - '/^3$/'
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 17.1.2
      NIST800-53R5:
        - AU-3
        - AU-3(1)
        - AU-7
        - AU-12
    {{ end }}
  {{ end }}
{{ end }}
