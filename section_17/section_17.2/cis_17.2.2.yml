    contents:
      - '/^[13]$/'
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 17.2.2
      NIST800-53R5:
        - AU-3
        - AU-3(1)
        - AU-7
        - AU-12
    {{ end }}
  {{ end }}
