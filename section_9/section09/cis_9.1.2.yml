---

{{ if .Vars.win22cis_level_1 }}
  {{ if .Vars.win22cis_rule_9_1_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\DefaultInboundAction:
    title: "9.1.2 | Ensure 'Windows Firewall: Domain: Inbound connections' is set to 'Block (default)' | DefaultInboundAction"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 9.1.2
      NIST800-53R5:
        - SC-7
        - SC-7(5)
file:
  win22cis_9_1_2_effective:
    title: "9.1.2 | Ensure 'Windows Firewall: Domain: Inbound connections' is set to 'Block (default)' | effective"
    path: '{{ .Vars.win22cis_snapshot_dir }}\Firewall.Domain.DefaultInboundAction'
    exists: true
    contents:
      - '/^Block$/'
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 9.1.2
      NIST800-53R5:
        - SC-7
        - SC-7(5)
  {{ end }}
{{ end }}
