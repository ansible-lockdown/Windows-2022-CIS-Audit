---

{{ if .Vars.win22cis_level_1 }}
  {{ if .Vars.win22cis_rule_2_2_31 }}
file:
  win22cis_2_2_31_seauditprivilege:
    title: "2.2.31 | Ensure 'Generate security audits' is set to 'LOCAL SERVICE, NETWORK SERVICE' | SeAuditPrivilege"
    path: '{{ .Vars.win22cis_snapshot_dir }}\PrivilegeRights.SeAuditPrivilege'
    exists: true
    contents:
      - '/^S-1-5-19,S-1-5-20$/'
    skip: {{ if or (not (or .Vars.win22cis_iis_and_web_services_installed .Vars.win22cis_adfs_installed)) .Vars.win22cis_apply_generate_security_audits_on_iis_adfs }}false{{ else }}true{{ end }}
    meta:
      skip_reason: "IIS or ADFS installed - CIS requires an exception for this right on these hosts, so the role does not apply it"
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.2.31
      NIST800-53R5:
        - AC-2
        - AC-3
        - AC-6
        - AC-6(1)
        - AC-6(7)
        - AU-9(4)
  {{ end }}
{{ end }}
