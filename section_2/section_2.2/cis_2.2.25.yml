---

{{ if and (eq .Vars.win22cis_system_role "domaincontroller") .Vars.win22cis_level_1 }}
  {{ if .Vars.win22cis_rule_2_2_25 }}
    {{ if eq .Vars.win22cis_system_role "domaincontroller" }}
file:
  win22cis_2_2_25_sedenyremoteinteractivelogonright:
    title: "2.2.25 | Ensure 'Deny log on through Remote Desktop Services' to include 'Guests' (DC only) | SeDenyRemoteInteractiveLogonRight"
    path: '{{ .Vars.win22cis_snapshot_dir }}\PrivilegeRights.SeDenyRemoteInteractiveLogonRight'
    exists: true
    contents:
      - '/^(.*,)?S-1-5-32-546(,.*)?$/'
    skip: {{ if not .Vars.win22cis_win_skip_for_test }}false{{ else }}true{{ end }}
    meta:
      skip_reason: "win_skip_for_test is set - the role leaves this control alone so the managing connection survives; set win_skip_for_test: false to apply it"
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 2.2.25
      NIST800-53R5:
        - AC-2
        - AC-3
        - AC-6
        - AC-6(1)
        - AC-6(7)
        - AU-9(4)
    {{ end }}
  {{ end }}
{{ end }}
