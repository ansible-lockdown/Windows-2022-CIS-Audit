---

{{ if .Vars.win22cis_level_1 }}
  {{ if .Vars.win22cis_rule_2_3_11_9 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\Ldap\LDAPClientIntegrity:
    title: "2.3.11.9 | Ensure 'Network security: LDAP client signing requirements' is set to 'Negotiate signing' or higher | LDAPClientIntegrity"
    exists: true
    value: {{ .Vars.win22cis_ldap_client_integrity }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.11.9
      NIST800-53R5:
        - AC-17(2)
        - IA-5
        - IA-5(1)
        - SC-8
        - SC-8(1)
  {{ end }}
{{ end }}
